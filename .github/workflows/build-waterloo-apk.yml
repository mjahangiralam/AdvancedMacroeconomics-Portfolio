name: Build Waterloo Work APK

on:
  push:
    branches:
      - waterloo-work-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: waterloo-apk
        run: gradle --no-daemon assembleDebug

      - name: Prepare installable APK
        run: cp waterloo-apk/app/build/outputs/apk/debug/app-debug.apk WaterlooWork.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterlooWork-Android
          path: WaterlooWork.apk
          if-no-files-found: error
